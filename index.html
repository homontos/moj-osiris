<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Sieć Fabryka - LiveUAMap OSINT</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #0b0f19; font-family: sans-serif; color: #fff; overflow: hidden; }
        
        /* Ramka z mapą LiveUAMap rozciągnięta na cały ekran */
        iframe { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; border: none; z-index: 1; }
        
        /* Futurystyczny panel boczny w stylu OSIRIS nałożony nad mapę */
        .dashboard-overlay { position: absolute; top: 20px; left: 20px; width: 330px; background: rgba(11, 15, 25, 0.95); backdrop-filter: blur(10px); border: 1px solid #1e293b; padding: 20px; border-radius: 12px; z-index: 10; box-shadow: 0 4px 20px rgba(0,0,0,0.5); pointer-events: none; }
        h1 { font-size: 1.2rem; margin: 0 0 5px 0; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }
        .status-pulse { display: inline-block; width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%; margin-right: 5px; box-shadow: 0 0 8px #22c55e; }
        p { font-size: 0.85rem; color: #94a3b8; margin: 0 0 15px 0; }
        .data-item { padding: 10px 12px; background: rgba(30, 41, 59, 0.8); border-left: 3px solid #ef4444; font-size: 0.8rem; border-radius: 4px; margin-bottom: 8px; }
        .location-tag { font-size: 0.7rem; color: #38bdf8; text-transform: uppercase; font-weight: bold; display: block; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- Panel boczny Osiris -->
    <div class="dashboard-overlay">
        <h1>Moja Sieć Fabryka</h1>
        <p><span class="status-pulse"></span>Kanał Informacji Krytycznych (OSINT)</p>
        
        <div id="custom-points-list">
            <div class="data-item">
                <strong>Główny punkt sieci</strong><br>Węzeł kontrolny monitoruje globalne zdarzenia LiveUAMap.
                <span class="location-tag">Baza: Gdynia</span>
            </div>
            <div class="data-item" style="border-left-color: #f59e0b;">
                <strong>Źródło LiveUAMap</strong><br>Poniższa mapa pobiera oraz centruje krytyczne raporty geopolityczne w czasie rzeczywistym.
                <span class="location-tag">Status: Połączono z Satelitą</span>
            </div>
        </div>
    </div>

    <!-- Integracja z oficjalną globalną ramką LiveUAMap -->
    <iframe 
        src="https://liveuamap.com/frame">
    </iframe>

</body>
</html>
