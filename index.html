<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Sieć Fabryka - Panel OSINT & AIS</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #05070f; font-family: 'Courier New', monospace; color: #fff; overflow: hidden; display: flex; }
        
        /* Ekran radaru wojskowego */
        .radar-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #091124 0%, #040814 90%); }
        .radar-svg { width: 700px; height: 700px; max-width: 95vw; max-height: 95vh; }
        
        /* Animacja wiązki skanującej */
        @keyframes sweep {
            0% { transform: rotate(0deg); opacity: 0.6; }
            50% { opacity: 0.2; }
            100% { transform: rotate(360deg); opacity: 0.6; }
        }
        .scanner-beam { transform-origin: 100px 100px; animation: sweep 7s infinite linear; stroke: #10b981; stroke-width: 1; filter: drop-shadow(0 0 4px #10b981); }
        
        /* Panel boczny OSIRIS z płynną animacją chowania (Transition) */
        .dashboard { position: absolute; top: 20px; left: 20px; width: 360px; background: rgba(4, 8, 20, 0.95); border: 1px solid #10b981; padding: 20px; border-radius: 8px; z-index: 10; box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); box-sizing: border-box; transition: transform 0.4s ease, opacity 0.4s ease; }
        
        /* Klasa dodawana przez JavaScript, gdy menu jest schowane */
        .dashboard.hidden { transform: translateX(-380px); opacity: 0; pointer-events: none; }
        
        /* Hakerski przycisk do zwijania/rozwijania menu */
        .menu-toggle { position: absolute; top: 20px; left: 20px; background: #040814; border: 1px solid #10b981; color: #10b981; padding: 8px 14px; font-family: 'Courier New', monospace; font-size: 0.8rem; cursor: pointer; border-radius: 4px; z-index: 11; box-shadow: 0 0 10px rgba(16, 185, 129, 0.3); font-weight: bold; }
        .menu-toggle:hover { background: #10b981; color: #040814; }
        
        h1 { font-size: 1.1rem; margin: 0 40px 5px 0; color: #10b981; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 5px rgba(16, 185, 129, 0.5); }
        .subtitle { font-size: 0.7rem; color: #4b5563; margin: 0 0 15px 0; text-transform: uppercase; letter-spacing: 1px; }
        
        .alerts-container { max-height: 75vh; overflow-y: auto; padding-right: 5px; }
        .alert-card { padding: 10px; background: rgba(15, 23, 42, 0.7); border: 1px solid #111827; border-left: 4px solid #10b981; font-size: 0.75rem; border-radius: 4px; margin-bottom: 8px; line-height: 1.4; }
        .alert-card.critical { border-left-color: #ef4444; }
        .alert-time { font-size: 0.65rem; color: #10b981; display: block; margin-bottom: 2px; font-weight: bold; }
        .alert-card.critical .alert-time { color: #ef4444; }
        
        /* Style dla statków i tekstu na radarze */
        .ship { fill: #38bdf8; transition: transform 0.5s linear; filter: drop-shadow(0 0 2px #38bdf8); }
        .ship-label { fill: #94a3b8; font-size: 3px; font-family: sans-serif; font-weight: bold; }
        .coastline { fill: none; stroke: #1e293b; stroke-width: 1.5; stroke-dasharray: 4 2; }
    </style>
</head>
<body>

    <!-- Przycisk kontrolny (zawsze widoczny) -->
    <button class="menu-toggle" id="toggle-btn" onclick="toggleMenu()">[ UKRYJ MENU ]</button>

    <!-- Panel boczny OSIRIS -->
    <div class="dashboard" id="main-sidebar" style="margin-top: 50px;">
        <h1>Moja Sieć Fabryka</h1>
        <div class="subtitle">AUTONOMICZNY NASŁUCH AIS: ZATOKA GDAŃSKA</div>
        
        <div class="alerts-container" id="live-ais-list">
            <!-- Skrypt JS sam wygeneruje listę obiektów AIS na żywo -->
        </div>
    </div>

    <!-- Ekran Radaru i Mapy Wektorowej Zatoki -->
    <div class="radar-screen">
        <svg class="radar-svg" viewBox="0 0 200 200">
            <!-- Siatka celownicza radaru wojskowego -->
            <circle cx="100" cy="100" r="90" fill="none" stroke="#14532d" stroke-width="0.3" />
            <circle cx="100" cy="100" r="65" fill="none" stroke="#14532d" stroke-width="0.3" />
            <circle cx="100" cy="100" r="40" fill="none" stroke="#14532d" stroke-width="0.3" />
            <line x1="10" y1="100" x2="190" y2="100" stroke="#14532d" stroke-width="0.3" />
            <line x1="100" y1="10" x2="100" y2="190" stroke="#14532d" stroke-width="0.3" />
            
            <!-- Uproszczona linia brzegowa Zatoki Gdańskiej -->
            <path d="M 30 110 Q 55 95 65 85 T 75 60 T 95 40 T 130 45" class="coastline" />
            
            <!-- Wiązka skanująca radaru -->
            <line x1="100" y1="100" x2="100" y2="10" class="scanner-beam" />
            
            <!-- Punkt bazowy: Fabryka Gdynia -->
            <circle cx="65" cy="85" r="2.5" fill="#10b981" filter="drop-shadow(0 0 3px #10b981)" />
            <text x="50" y="82" fill="#10b981" font-size="3.5" font-family="sans-serif">GDYNIA BASE</text>

            <!-- Dynamiczne obiekty morskich statków na radarze -->
            <g id="radar-ships"></g>
        </svg>
    </div>

    <script>
        // Funkcja do rozwijania i zwijania menu bocznego
        function toggleMenu() {
            const sidebar = document.getElementById('main-sidebar');
            const btn = document.getElementById('toggle-btn');
            
            if (sidebar.classList.contains('hidden')) {
                sidebar.classList.remove('hidden');
                btn.innerText = '[ UKRYJ MENU ]';
            } else {
                sidebar.classList.add('hidden');
                btn.innerText = '[ POKAŻ MENU ]';
            }
        }

        // Dane statków na Zatoce Gdańskiej
        const statki = [
            { id: "s1", name: "BALTIC OPERATOR", type: "Cargo", x: 75, y: 78, dx: 0.1, dy: -0.05, speed: "12.4 kn", status: "W drodze do Gdyni" },
            { id: "s2", name: "STENA SPIRIT", type: "Prom pasażerski", x: 88, y: 72, dx: -0.08, dy: 0.08, speed: "18.1 kn", status: "Wychodzi z portu" },
            { id: "s3", name: "GDAŃSK TUG 3", type: "Holownik", x: 92, y: 110, dx: 0.02, dy: 0.02, speed: "4.2 kn", status: "Operacje manewrowe" },
            { id: "s4", name: "NAVY 241", type: "Okręt wojskowy", x: 110, y: 65, dx: -0.05, dy: -0.05, speed: "15.0 kn", status: "Patrol Sektora" }
        ];

        function aktualizujRadar() {
            const containerStatkow = document.getElementById('radar-ships');
            const containerListy = document.getElementById('live-ais-list');
            
            containerStatkow.innerHTML = '';
            containerListy.innerHTML = '';

            statki.forEach(statek => {
                statek.x += statek.dx;
                statek.y += statek.dy;

                if (statek.x < 40 || statek.x > 160) statek.dx *= -1;
                if (statek.y < 30 || statek.y > 150) statek.dy *= -1;

                const g = document.createElementNS("http://w3.org", "g");
                
                const circle = document.createElementNS("http://w3.org", "circle");
                circle.setAttribute("cx", statek.x);
                circle.setAttribute("cy", statek.y);
                circle.setAttribute("r", "1.5");
                circle.setAttribute("class", "ship");
                if(statek.type === "Okręt wojskowy") circle.setAttribute("style", "fill: #ef4444; filter: drop-shadow(0 0 2px #ef4444);");
                
                const text = document.createElementNS("http://w3.org", "text");
                text.setAttribute("x", statek.x + 3);
                text.setAttribute("y", statek.y + 1);
                text.setAttribute("class", "ship-label");
                text.textContent = statek.name;

                g.appendChild(circle);
                g.appendChild(text);
                containerStatkow.appendChild(g);

                const card = document.createElement('div');
                card.className = `alert-card ${statek.type === 'Okręt wojskowy' ? 'critical' : ''}`;
                card.innerHTML = `
                    <span class="alert-time">[AIS OBJECT: ${statek.type.toUpperCase()}]</span>
                    <strong>${statek.name}</strong><br>
                    Prędkość: ${statek.speed} | Status: ${statek.status}<br>
                    <span style="color:#4b5563; font-size:9px;">POS: [${statek.x.toFixed(2)}, ${statek.y.toFixed(2)}]</span>
                `;
                containerListy.appendChild(card);
            });
        }

        setInterval(aktualizujRadar, 100);
    </script>
</body>
</html>
