<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Sieć Fabryka</title>
    <!-- Ładowanie super-stabilnej biblioteki Leaflet (zamiast problematycznego MapLibre) -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #0b0f19; font-family: sans-serif; color: #fff; overflow: hidden; }
        
        /* Pozycjonowanie mapy na pełen ekran */
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* Panel boczny w stylu OSIRIS */
        .dashboard-overlay { position: absolute; top: 20px; left: 20px; width: 320px; background: rgba(11, 15, 25, 0.9); backdrop-filter: blur(10px); border: 1px solid #1e293b; padding: 20px; border-radius: 12px; z-index: 10; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { font-size: 1.2rem; margin: 0 0 10px 0; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }
        p { font-size: 0.85rem; color: #94a3b8; margin: 0 0 15px 0; }
        .data-item { padding: 8px 12px; background: rgba(30, 41, 59, 0.6); border-left: 3px solid #38bdf8; font-size: 0.8rem; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="dashboard-overlay">
        <h1>Moja Sieć Fabryka</h1>
        <p>System wizualizacji danych</p>
        <div id="custom-points-list">
            <div class="data-item">
                <strong>Fabryka Gdynia</strong><br>Główny węzeł sieci i punkt dowodzenia.
            </div>
        </div>
    </div>

    <!-- Kontener mapy -->
    <div id="map"></div>

    <script>
        // Inicjalizacja mapy Leaflet wyśrodkowanej na Gdynię [Szerokość, Długość]
        // UWAGA: Leaflet przyjmuje współrzędne w odwrotnej kolejności niż MapLibre!
        const map = L.map('map', {
            zoomControl: false // Wyłączamy domyślne przyciski, żeby dać je w lepsze miejsce
        }).setView([54.5189, 18.5305], 12);

        // Dodanie darmowych kafelków w stylu Dark Matter (piękny, ciemny design)
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Przeniesienie przycisków zoomu w prawy górny róg
        L.control.zoom({ position: 'top-right' }).addTo(map);

        // Dodanie punktu kontrolnego w Gdyni
        const marker = L.marker([54.5189, 18.5305]).addTo(map);
        
        // Dodanie wyskakującego okienka po kliknięciu w punkt
        marker.bindPopup('<b style="color:#000;">Fabryka Gdynia</b><br><span style="color:#334155;">Główny punkt sieci.</span>');
    </script>
</body>
</html>
