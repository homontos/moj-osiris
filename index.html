<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Sieć Fabryka</title>
    <!-- Ładowanie stabilnej biblioteki mapowej -->
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com" rel="stylesheet" />
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #0b0f19; font-family: sans-serif; color: #fff; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* Panel boczny w stylu OSIRIS */
        .dashboard-overlay { position: absolute; top: 20px; left: 20px; width: 320px; background: rgba(11, 15, 25, 0.9); backdrop-filter: blur(10px); border: 1px solid #1e293b; padding: 20px; border-radius: 12px; z-index: 10; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { font-size: 1.2rem; margin: 0 0 10px 0; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }
        p { font-size: 0.85rem; color: #94a3b8; margin: 0 0 15px 0; }
        .data-item { padding: 8px 12px; background: rgba(30, 41, 59, 0.6); border-left: 3px solid #38bdf8; font-size: 0.8rem; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="dashboard-overlay">
        <h1>Moja Sieć Fabryka</h1>
        <p>System wizualizacji danych</p>
        <div id="custom-points-list">
            <div class="data-item">
                <strong>Fabryka Gdynia</strong><br>Główny węzeł sieci i punkt dowodzenia.
            </div>
        </div>
    </div>

    <!-- Kontener mapy -->
    <div id="map"></div>

    <script>
        // Satelitarny układ odporny na blokady serwerów i CORS
        const stylSatelitarny = {
            "version": 8,
            "sources": {
                "satelita-kafelki": {
                    "type": "raster",
                    "tiles": [
                        "https://arcgisonline.com{z}/{y}/{x}"
                    ],
                    "tileSize": 256,
                    "attribution": "Esri"
                }
            },
            "layers": [
                {
                    "id": "satelita-warstwa",
                    "type": "raster",
                    "source": "satelita-kafelki",
                    "minzoom": 0,
                    "maxzoom": 19
                }
            ]
        };

        // Inicjalizacja mapy
        const map = new maplibreGl.Map({
            container: 'map',
            style: stylSatelitarny,
            center: [18.5305, 54.5189], // Środek na Gdynię
            zoom: 12
        });

        map.addControl(new maplibreGl.NavigationControl(), 'top-right');

        // Wyświetlenie markera po załadowaniu
        map.on('load', () => {
            const popup = new maplibreGl.Popup({ offset: 25 })
                .setHTML('<h3 style="color:#0b0f19; margin:0 0 5px 0;">Fabryka Gdynia</h3><p style="color:#475569; margin:0; font-size:13px;">Główny punkt sieci.</p>');

            new maplibreGl.Marker({ color: '#38bdf8' })
                .setLngLat([18.5305, 54.5189])
                .setPopup(popup)
                .addTo(map);
        });
    </script>
</body>
</html>
