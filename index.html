<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mój Własny Osiris - Panel Danych</title>
    <!-- Ładowanie najnowszej biblioteki MapLibre obsługującej pełny widok globu 3D -->
    <script src="https://unpkg.com"></script>
    <link href="https://unpkg.com" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; background-color: #0b0f19; font-family: sans-serif; color: #fff; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        .dashboard-overlay { position: absolute; top: 20px; left: 20px; width: 320px; background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(10px); border: 1px solid #1e293b; padding: 20px; border-radius: 12px; z-index: 10; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { font-size: 1.2rem; margin: 0 0 10px 0; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }
        p { font-size: 0.85rem; color: #94a3b8; margin: 0 0 15px 0; }
        .data-list { list-style: none; padding: 0; margin: 0; max-height: 300px; overflow-y: auto; }
        .data-item { padding: 8px 12px; margin-bottom: 6px; background: rgba(30, 41, 59, 0.5); border-left: 3px solid #38bdf8; font-size: 0.8rem; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="dashboard-overlay">
        <h1 id="db-title">Moja Sieć Osiris</h1>
        <p>System wizualizacji danych</p>
        <div class="data-list" id="custom-points-list">
            <div class="data-item">Wczytywanie danych punktowych...</div>
        </div>
    </div>
    <div id="map"></div>
    <script src="app.js"></script>
</body>
</html>
