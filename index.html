<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Sieć Fabryka</title>
    <!-- Stabilna wersja biblioteki Open-Source bez błędów ładowania -->
    <script src="https://unpkg.com"></script>
    <link href="https://unpkg.com" rel="stylesheet" />
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #0b0f19; font-family: sans-serif; color: #fff; overflow: hidden; }
        
        /* Wymuszenie fizycznych wymiarów mapy na ekranie */
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        /* Panel boczny w stylu OSIRIS */
        .dashboard-overlay { position: absolute; top: 20px; left: 20px; width: 320px; background: rgba(11, 15, 25, 0.9); backdrop-filter: blur(10px); border: 1px solid #1e293b; padding: 20px; border-radius: 12px; z-index: 10; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h1 { font-size: 1.2rem; margin: 0 0 10px 0; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }
        p { font-size: 0.85rem; color: #94a3b8; margin: 0 0 15px 0; }
        .data-item { padding: 8px 12px; background: rgba(30, 41, 59, 0.6); border-left: 3px solid #38bdf8; font-size: 0.8rem; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="dashboard-overlay">
        <h1>Moja Sieć Fabryka</h1>
        <p>System wizualizacji danych</p>
        <div id="custom-points-list">
            <div class="data-item">
                <strong>Fabryka Gdynia</strong><br>Główny węzeł sieci i punkt dowodzenia.
            </div>
        </div>
    </div>

    <!-- Kontener mapy -->
    <div id="map"></div>

    <script>
        // Czysty obraz satelitarny odporny na blokady serwerowe zewnętrznych stylów
        const stylSatelity = {
            "version": 8,
            "sources": {
                "satelita-źródło": {
                    "type": "raster",
                    "tiles": ["https://arcgisonline.com{z}/{y}/{x}"],
                    "tileSize": 256
                }
            },
            "layers": [{
                "id": "satelita-warstwa",
                "type": "raster",
                "source": "satelita-źródło"
            }]
        };

        // Inicjalizacja mapy bezpośrednio w index.html (brak pliku app.js rozwiązuje konflikty pamięci cache)
        const map = new maplibreGl.Map({
            container: 'map',
            style: stylSatelity,
            center: [18.5305, 54.5189], // Gdynia
            zoom: 12
        });

        map.addControl(new maplibreGl.NavigationControl(), 'top-right');

        // Dodanie niebieskiego markera sieci po załadowaniu
        map.on('load', () => {
            new maplibreGl.Marker({ color: '#38bdf8' })
                .setLngLat([18.5305, 54.5189])
                .addTo(map);
        });
    </script>
</body>
</html>
